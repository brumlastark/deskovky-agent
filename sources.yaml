sources:
  # === CZ (priorita: nižší číslo = vyšší priorita při shodě titulu) ===
  
  - id: tlama_novinky
    label: TLAMA – Novinky v češtině
    kind: cz
    priority: 10
    urls:
      - https://www.tlamagames.com/novinky-v-cestine/
    allow_domains: ["www.tlamagames.com"]
    product_url_must_contain: ["/deskove-hry/"]
    product_url_must_not_contain:
      - "/registrace"
      - "/klient/"
      - "/kosik"
      - "/obchodni-"
      - "/podminky"
      - "/doprava_"
      - "/affiliate"
      - "/action/language"
      - "/deskove-hry/encyklopedie"
      - "/deskove-hry/deskove-hry"
      - "/strana-"
    pagination:
      type: path_custom
      pattern: "strana-{page}"
      start: 1
      max_pages: 3

  - id: tlama_predprodej
    label: TLAMA – Předprodej
    kind: cz
    priority: 9
    urls:
      - https://www.tlamagames.com/predprodej/
    allow_domains: ["www.tlamagames.com"]
    product_url_must_contain: ["/deskove-hry/"]
    product_url_must_not_contain:
      - "/registrace"
      - "/klient/"
      - "/kosik"
      - "/obchodni-"
      - "/podminky"
      - "/doprava_"
      - "/affiliate"
      - "/action/language"
      - "/deskove-hry/encyklopedie"
      - "/deskove-hry/deskove-hry"
      - "/strana-"
    pagination:
      type: path_custom
      pattern: "strana-{page}"
      start: 1
      max_pages: 3

  # Katalog - hlavní zdroj pro rozšíření
  - id: tlama_katalog
    label: TLAMA – Katalog
    kind: cz
    priority: 15
    urls:
      - https://www.tlamagames.com/deskove-hry/
    allow_domains: ["www.tlamagames.com"]
    product_url_must_contain: ["/deskove-hry/"]
    product_url_must_not_contain:
      - "/registrace"
      - "/klient/"
      - "/kosik"
      - "/obchodni-"
      - "/podminky"
      - "/doprava_"
      - "/affiliate"
      - "/action/language"
      - "/deskove-hry/encyklopedie"
      - "/deskove-hry/deskove-hry"
      - "/strana-"
    # TLAMA používá /strana-2/, /strana-3/ atd.
    pagination:
      type: path_custom
      pattern: "strana-{page}"
      start: 1
      max_pages: 15

  - id: rexhry_katalog
    label: Rexhry – Katalog (nejnovější)
    kind: cz
    priority: 30
    urls:
      - https://www.rexhry.cz/katalog
    allow_domains: ["www.rexhry.cz"]
    product_url_must_contain_any:
      - "/katalog/"
      - "/produkt/"
      - "/hra/"
      - "/hry/"
    product_url_must_not_contain:
      - "/katalog?"
      - "/pripravujeme"
    pagination:
      type: query_param
      param: page
      start: 1
      max_pages: 5

  - id: rexhry_pripravujeme
    label: Rexhry – Připravujeme
    kind: cz
    priority: 31
    urls:
      - https://www.rexhry.cz/pripravujeme
    allow_domains: ["www.rexhry.cz"]
    product_url_must_contain_any:
      - "/katalog/"
      - "/produkt/"
      - "/hra/"
      - "/hry/"
    pagination:
      type: none

  - id: albi_hry
    label: Albi – Hry
    kind: cz
    priority: 40
    urls:
      - https://albi.cz/hry/
    allow_domains: ["albi.cz", "www.albi.cz"]
    product_url_must_contain_any:
      - "/hry/"
    product_url_must_not_contain:
      - "/edicni-plan"
    pagination:
      type: query_param
      param: page
      start: 1
      max_pages: 5

  - id: albi_edicni_plan
    label: Albi – Ediční plán
    kind: cz
    priority: 41
    urls:
      - https://albi.cz/cteni-pro-radost/edicni-plan-her-albi/
    allow_domains: ["albi.cz", "www.albi.cz"]
    product_url_must_contain_any:
      - "/hry/"
      - "/produkt/"
      - "/produkt-detail/"
    pagination:
      type: none

  - id: asmodee_katalog
    label: Asmodee CZ – Katalog
    kind: cz
    priority: 50
    urls:
      - https://www.asmodee.cz/katalog-her/
    allow_domains: ["www.asmodee.cz"]
    product_url_must_contain_any:
      - "/katalog-her/"
      - "/hra/"
      - "/hry/"
    product_url_must_not_contain:
      - "/pripravujeme/"
    pagination:
      type: query_param
      param: page
      start: 1
      max_pages: 4

  - id: asmodee_pripravujeme
    label: Asmodee CZ – Připravujeme
    kind: cz
    priority: 51
    urls:
      - https://www.asmodee.cz/pripravujeme/
    allow_domains: ["www.asmodee.cz"]
    product_url_must_contain_any:
      - "/katalog-her/"
      - "/hra/"
      - "/hry/"
    pagination:
      type: none

  - id: mindok_nase_hry
    label: MindOK – Naše hry (nejnovější)
    kind: cz
    priority: 60
    urls:
      - https://mindok.cz/nase-hry/
    allow_domains: ["mindok.cz", "www.mindok.cz"]
    product_url_must_contain_any:
      - "/hry/"
      - "/nase-hry/"
      - "/hra/"
    pagination:
      type: query_param
      param: page
      start: 1
      max_pages: 4

  - id: mindok_pripravujeme
    label: MindOK – Připravujeme
    kind: cz
    priority: 61
    urls:
      - https://mindok.cz/hry/pripravujeme/
    allow_domains: ["mindok.cz", "www.mindok.cz"]
    product_url_must_contain_any:
      - "/hry/"
      - "/nase-hry/"
      - "/hra/"
    pagination:
      type: none

  # === Crowdfunding ===
  - id: kickstarter_tabletop
    label: Kickstarter
    kind: crowdfunding
    priority: 200
    urls:
      - https://www.kickstarter.com/discover/categories/games/tabletop%20games
    allow_domains: ["www.kickstarter.com"]
    product_url_must_contain: ["/projects/"]
    product_url_must_not_contain:
      - "/discover/"
      - "/login"
      - "/signup"
    pagination:
      type: none

  - id: gamefound_tabletop
    label: Gamefound
    kind: crowdfunding
    priority: 201
    urls:
      - https://gamefound.com/discover/board-games
      - https://gamefound.com/discover/all?projectPhase=active&category=Board+Games
    allow_domains: ["gamefound.com", "www.gamefound.com"]
    product_url_must_contain_any:
      - "/projects/"
      - "/campaign/"
    product_url_must_not_contain:
      - "/discover/"
      - "/login"
      - "/signup"
      - "/register"
    pagination:
      type: none
