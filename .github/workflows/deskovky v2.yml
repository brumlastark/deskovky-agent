name: Deskovkový briefing

on:
  schedule:
    - cron: '05 10 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run agent
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

          GROUP_CSV_URL: ${{ secrets.GROUP_CSV_URL }}
          COLLECTION_CSV_URL: ${{ secrets.COLLECTION_CSV_URL }}
          
          # Scraping limits
          PER_SOURCE_ITEM_CAP: ${{ secrets.PER_SOURCE_ITEM_CAP }}
          
          # AI limits (optional)
          AI_SCORE_LIMIT_CZ: ${{ secrets.AI_SCORE_LIMIT_CZ }}
          AI_SCORE_LIMIT_CF: ${{ secrets.AI_SCORE_LIMIT_CF }}
          AI_TOP_N_CZ: ${{ secrets.AI_TOP_N_CZ }}
          AI_TOP_N_CF: ${{ secrets.AI_TOP_N_CF }}
        run: |
          python agent.py
